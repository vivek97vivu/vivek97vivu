<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220">
  <defs>
    <linearGradient id="area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes draw-line {
      from { stroke-dashoffset: 1500; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scale-up {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .title { font-size: 13px; font-weight: 700; fill: #58a6ff; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; text-anchor: middle; }
    .axis-text { font-size: 9px; fill: #8b949e; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    .x-axis { text-anchor: middle; }
    .y-axis { text-anchor: end; }
    .grid-line { stroke: #161b22; stroke-dasharray: 2 3; stroke-width: 1; }
    .chart-line { fill: none; stroke: url(#line-grad); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: draw-line 2s ease-out forwards; }
    .chart-area { fill: url(#area-grad); opacity: 0; animation: fade-in 1.5s 1s ease-out forwards; }
    .dot { fill: #ffffff; stroke: #38bdf8; stroke-width: 2; transform-origin: center; opacity: 0; animation: scale-up 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .dot:hover { r: 5.5; stroke: #818cf8; cursor: pointer; }
    .y-label { font-size: 9px; fill: #8b949e; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; text-anchor: middle; }
  </style>

  <!-- Background card -->
  <rect width="858" height="218" x="1" y="1" rx="6" class="bg" />

  <!-- Graph Title -->
  <text x="430" y="24" class="title">Vivek Joy's Contribution Graph</text>

  <!-- Y-Axis Label (Rotated) -->
  <text x="15" y="120" class="y-label" transform="rotate(-90 15 120)">Contributions</text>
  <text x="430" y="215" class="y-label">Days</text>

  <!-- Grid Lines and Y-Axis Labels -->
  <line x1="45" y1="190.0" x2="825" y2="190.0" class="grid-line" />
