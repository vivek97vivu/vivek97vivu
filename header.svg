<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>

    <!-- Text / Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes pulse-core {
      0% { r: 16; opacity: 0.7; }
      50% { r: 22; opacity: 1; filter: url(#glow-strong); }
      100% { r: 16; opacity: 0.7; }
    }
    @keyframes pulse-node {
      0% { r: 4; opacity: 0.5; }
      50% { r: 7; opacity: 0.9; }
      100% { r: 4; opacity: 0.5; }
    }
    @keyframes signal-flow {
      to {
        stroke-dashoffset: -40;
      }
    }
    @keyframes scanning {
      0% { transform: translateY(10px); opacity: 0.1; }
      50% { opacity: 0.8; }
      100% { transform: translateY(290px); opacity: 0.1; }
    }
    @keyframes rotate-reticle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }
    @keyframes text-glitch {
      0%, 100% { opacity: 1; }
      95% { opacity: 1; }
      96% { opacity: 0.8; }
      97% { opacity: 1; }
      99% { opacity: 0.5; }
    }
    
    .bg { fill: url(#bg-gradient); }
    .grid { stroke: #1e293b; stroke-width: 0.5; opacity: 0.3; }
    .core-node { fill: #818cf8; animation: pulse-core 3s infinite ease-in-out; }
    .network-node { fill: #38bdf8; animation: pulse-node 2s infinite ease-in-out; }
    .network-node-alt { fill: #c084fc; animation: pulse-node 2.5s infinite ease-in-out; }
    .signal-line { stroke: #4f46e5; stroke-width: 1.5; stroke-dasharray: 8, 12; animation: signal-flow 1.5s linear infinite; }
    .signal-line-fast { stroke: #c084fc; stroke-width: 1.5; stroke-dasharray: 5, 10; animation: signal-flow 1s linear infinite; }
    .scan-line { stroke: #06b6d4; stroke-width: 1.5; filter: url(#glow); animation: scanning 6s infinite linear; }
    .reticle { transform-origin: 180px 150px; animation: rotate-reticle 10s linear infinite; }
    .cursor { fill: #38bdf8; animation: blink 1s infinite; }
    .floating-group { animation: float 4s infinite ease-in-out; }
    .glitch-text { animation: text-glitch 5s infinite; }
  </style>

  <!-- Background -->
  <rect width="850" height="320" class="bg" />

  <!-- Grid lines -->
  <g class="grid">
    <!-- Horizontal -->
    <line x1="0" y1="40" x2="850" y2="40" />
    <line x1="0" y1="80" x2="850" y2="80" />
    <line x1="0" y1="120" x2="850" y2="120" />
    <line x1="0" y1="160" x2="850" y2="160" />
    <line x1="0" y1="200" x2="850" y2="200" />
    <line x1="0" y1="240" x2="850" y2="240" />
    <line x1="0" y1="280" x2="850" y2="280" />
    <!-- Vertical -->
    <line x1="50" y1="0" x2="50" y2="320" />
    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="150" y1="0" x2="150" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="250" y1="0" x2="250" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="350" y1="0" x2="350" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="450" y1="0" x2="450" y2="320" />
    <line x1="500" y1="0" x2="500" y2="320" />
    <line x1="550" y1="0" x2="550" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="650" y1="0" x2="650" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="750" y1="0" x2="750" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
  </g>

  <!-- YOLO Bounding Box & Scan line (Left half - AI Visualization) -->
  <g>
    <!-- Scanning Laser -->
    <line x1="30" y1="0" x2="330" y2="0" class="scan-line" />
    
    <!-- Object Detection Box (Simulating YOLO) -->
    <rect x="50" y="40" width="260" height="220" rx="6" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4, 4" opacity="0.4" />
    <path d="M 50 60 L 50 40 L 70 40 M 290 40 L 310 40 L 310 60 M 310 240 L 310 260 L 290 260 M 70 260 L 50 260 L 50 240" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#glow)" />
    
    <!-- Class tag -->
    <rect x="50" y="20" width="90" height="20" fill="#06b6d4" rx="3" />
    <text x="56" y="34" fill="#0b0f19" font-size="10" font-weight="bold" letter-spacing="1">AI_CORE: 99%</text>
  </g>

  <!-- Neural Network Diagram (Centered at 180, 150) -->
  <g class="floating-group">
    <!-- Static connection lines (background) -->
    <g stroke="#1e293b" stroke-width="1" opacity="0.6">
      <!-- Input to Hidden 1 -->
      <line x1="80" y1="90" x2="140" y2="70" />
      <line x1="80" y1="90" x2="140" y2="120" />
      <line x1="80" y1="150" x2="140" y2="70" />
      <line x1="80" y1="150" x2="140" y2="120" />
      <line x1="80" y1="150" x2="140" y2="180" />
      <line x1="80" y1="210" x2="140" y2="180" />
      <line x1="80" y1="210" x2="140" y2="230" />
      <!-- Hidden 1 to Core -->
      <line x1="140" y1="70" x2="180" y2="150" />
      <line x1="140" y1="120" x2="180" y2="150" />
      <line x1="140" y1="180" x2="180" y2="150" />
      <line x1="140" y1="230" x2="180" y2="150" />
      <!-- Core to Hidden 2 -->
      <line x1="180" y1="150" x2="220" y2="70" />
      <line x1="180" y1="150" x2="220" y2="120" />
      <line x1="180" y1="150" x2="220" y2="180" />
      <line x1="180" y1="150" x2="220" y2="230" />
      <!-- Hidden 2 to Output -->
      <line x1="220" y1="70" x2="280" y2="100" />
      <line x1="220" y1="120" x2="280" y2="100" />
      <line x1="220" y1="120" x2="280" y2="150" />
      <line x1="220" y1="180" x2="280" y2="150" />
      <line x1="220" y1="180" x2="280" y2="200" />
      <line x1="220" y1="230" x2="280" y2="200" />
    </g>

    <!-- Animated Active Signal Lines -->
    <g fill="none">
      <path d="M 80 150 L 140 120 L 180 150" class="signal-line" />
      <path d="M 80 90 L 140 70 L 180 150" class="signal-line-fast" />
      <path d="M 180 150 L 220 180 L 280 200" class="signal-line" />
      <path d="M 180 150 L 220 120 L 280 150" class="signal-line-fast" />
      <path d="M 80 210 L 140 180 L 180 150 L 220 70 L 280 100" class="signal-line" />
    </g>

    <!-- Scanning Reticle around Core -->
    <g class="reticle" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5, 10" fill="none" opacity="0.8">
      <circle cx="180" cy="150" r="30" />
      <circle cx="180" cy="150" r="35" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="2, 4" />
    </g>

    <!-- Nodes -->
    <!-- Input layer -->
    <circle cx="80" cy="90" r="5" class="network-node" />
    <circle cx="80" cy="150" r="5" class="network-node" />
    <circle cx="80" cy="210" r="5" class="network-node" />
    
    <!-- Hidden layer 1 -->
    <circle cx="140" cy="70" r="6" class="network-node-alt" />
    <circle cx="140" cy="120" r="6" class="network-node" />
    <circle cx="140" cy="180" r="6" class="network-node" />
    <circle cx="140" cy="230" r="6" class="network-node-alt" />
    
    <!-- Central Core (AI Brain Core) -->
    <circle cx="180" cy="150" r="18" class="core-node" />
    <circle cx="180" cy="150" r="8" fill="#ffffff" filter="url(#glow)" />

    <!-- Hidden layer 2 -->
    <circle cx="220" cy="70" r="6" class="network-node" />
    <circle cx="220" cy="120" r="6" class="network-node-alt" />
    <circle cx="220" cy="180" r="6" class="network-node" />
    <circle cx="220" cy="230" r="6" class="network-node-alt" />

    <!-- Output layer -->
    <circle cx="280" cy="100" r="5" class="network-node" />
    <circle cx="280" cy="150" r="5" class="network-node" />
    <circle cx="280" cy="200" r="5" class="network-node" />
  </g>

  <!-- Right side content: Title & Terminal -->
  <g transform="translate(360, 0)">
    <!-- Tech Grid Detail -->
    <path d="M 0 30 L 440 30" stroke="#1e293b" stroke-width="1" />
    <path d="M 0 30 L 10 20 L 30 20" fill="none" stroke="#38bdf8" stroke-width="1" />
    
    <!-- Title: Vivek Joy -->
    <text x="10" y="70" fill="url(#primary-grad)" font-size="34" font-weight="900" letter-spacing="1.5" class="glitch-text">VIVEK JOY</text>
    <text x="10" y="95" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="3">AI &amp; COMPUTER VISION ENGINEER</text>

    <!-- Tech Badges (Horizontal Row) -->
    <g transform="translate(10, 115)" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="0.5">
      <!-- PyTorch -->
      <rect x="0" y="0" width="55" height="18" rx="3" fill="#e11d48" opacity="0.85" />
      <text x="7" y="12">PYTORCH</text>
      <!-- OpenCV -->
      <rect x="62" y="0" width="55" height="18" rx="3" fill="#16a34a" opacity="0.85" />
      <text x="10" y="12">OPENCV</text>
      <!-- CUDA -->
      <rect x="124" y="0" width="45" height="18" rx="3" fill="#059669" opacity="0.85" />
      <text x="10" y="12">CUDA</text>
      <!-- TensorRT -->
      <rect x="176" y="0" width="60" height="18" rx="3" fill="#4f46e5" opacity="0.85" />
      <text x="7" y="12">TENSORRT</text>
      <!-- YOLO -->
      <rect x="243" y="0" width="40" height="18" rx="3" fill="#ea580c" opacity="0.85" />
      <text x="8" y="12">YOLO</text>
    </g>

    <!-- Terminal Box (Simulating system thinking/activity) -->
    <g transform="translate(10, 155)">
      <!-- Box Border -->
      <rect width="440" height="135" rx="6" fill="#070a12" stroke="#1e293b" stroke-width="1.5" />
      
      <!-- Top Bar of Terminal -->
      <path d="M 0 25 L 440 25" stroke="#1e293b" stroke-width="1" />
      <!-- Three window circles -->
      <circle cx="15" cy="12" r="4" fill="#ef4444" />
      <circle cx="30" cy="12" r="4" fill="#eab308" />
      <circle cx="45" cy="12" r="4" fill="#22c55e" />
      <text x="70" y="16" fill="#475569" font-size="10" font-weight="bold" letter-spacing="1">BASH - AI_AGENT@VIVEK_CORE</text>

      <!-- Terminal content -->
      <g font-family="Courier New, monospace" font-size="11" fill="#38bdf8" xml:space="preserve">
        <text x="15" y="45" fill="#4ade80" opacity="0.9">> initializing model pipelines...</text>
        
        <!-- Animated / static status outputs -->
        <text x="15" y="65" fill="#94a3b8">> loading RF-DETR weights...</text>
        <text x="210" y="65" fill="#4ade80">[SUCCESS]</text>
        
        <text x="15" y="85" fill="#94a3b8">> MLflow: training loss = 0.0245</text>
        <text x="260" y="85" fill="#eab308">[EPOCH 89/100]</text>

        <text x="15" y="105" fill="#38bdf8">> status: active | thinking...</text>
        <rect x="250" y="96" width="8" height="11" class="cursor" />
      </g>
    </g>
  </g>
</svg>
