<svg xmlns="http://www.w3.org/2000/svg" width="310" height="165" viewBox="0 0 310 165">
  <defs>
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ff2c6d" />
    </linearGradient>
    <filter id="flame-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes flame-flicker {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08) translateY(-1px); opacity: 1; filter: url(#flame-glow); }
    }
    @keyframes count-fade {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .flame-path { fill: url(#flame-grad); transform-origin: 15px 15px; animation: flame-flicker 1.5s infinite ease-in-out; }
    .streak-val { fill: #38bdf8; font-size: 20px; font-weight: 800; text-anchor: middle; animation: count-fade 1s ease-out forwards; opacity: 0; }
    .streak-label { fill: #c9d1d9; font-size: 10px; font-weight: 600; text-anchor: middle; }
    .streak-sub { fill: #8b949e; font-size: 9px; text-anchor: middle; }
    .divider { stroke: #1e293b; stroke-width: 1.5; opacity: 0.5; }
  </style>
  
  <rect width="308" height="163" x="1" y="1" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Left Side: Total Contributions -->
  <g transform="translate(55, 80)">
    <text x="0" y="-15" class="streak-val" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" style="animation-delay: 0.1s; opacity: 1;">1,786</text>
    <text x="0" y="8" class="streak-label" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica">Total Contributions</text>
    <text x="0" y="24" class="streak-sub" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica">Feb 26, 2020 - Present</text>
  </g>
  
  <!-- First Vertical Divider -->
  <line x1="110" y1="35" x2="110" y2="130" class="divider" />
  
  <!-- Center: Current Streak -->
  <g transform="translate(155, 45)">
    <!-- Animated Flame Icon -->
    <g transform="translate(-15, -15)">
      <path d="M15 0C15 0 9 6 9 11C9 14.3 11.7 17 15 17C18.3 17 21 14.3 21 11C21 6 15 0 15 0ZM15 14C13.3 14 12 12.7 12 11C12 9.5 13.5 8 15 6.5C16.5 8 18 9.5 18 11C18 12.7 16.7 14 15 14Z" class="flame-path" />
    </g>
    
    <text x="0" y="32" class="streak-val" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" fill="#ff7b00" style="animation-delay: 0.2s; opacity: 1;">90</text>
    <text x="0" y="48" class="streak-label" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" fill="#ff7b00">Current Streak</text>
    <text x="0" y="60" class="streak-sub" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica">Jun 25</text>
  </g>
  
  <!-- Second Vertical Divider -->
  <line x1="200" y1="35" x2="200" y2="130" class="divider" />
  
  <!-- Right Side: Longest Streak -->
  <g transform="translate(255, 80)">
    <text x="0" y="-15" class="streak-val" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" fill="#38bdf8" style="animation-delay: 0.3s; opacity: 1;">90</text>
    <text x="0" y="8" class="streak-label" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica">Longest Streak</text>
    <text x="0" y="24" class="streak-sub" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica">Mar 27 - Jun 25</text>
  </g>
  
</svg>