<svg xmlns="http://www.w3.org/2000/svg" width="310" height="165" viewBox="0 0 310 165">
  <defs>
    <filter id="center-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes pulse-text {
      0%, 100% { opacity: 0.95; transform: scale(1) translate(0px, 0px); }
      50% { opacity: 1; transform: scale(1.05) translate(-1.5px, -1.5px); filter: url(#center-glow); }
    }
    .center-text {
      font-size: 11px;
      font-weight: 800;
      fill: #38bdf8;
      text-anchor: middle;
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica;
      transform-origin: 65px 93px;
      animation: pulse-text 2s infinite ease-in-out;
    }
    
    @keyframes draw-lang-0 {
      from { stroke-dashoffset: -98.96; }
      to { stroke-dashoffset: 0.00; }
    }
    .donut-seg-0 {
      animation: draw-lang-0 1.2s 0.0s ease-out forwards;
      stroke-dashoffset: -98.96;
    }
    

    @keyframes draw-lang-1 {
      from { stroke-dashoffset: -153.94; }
      to { stroke-dashoffset: -98.96; }
    }
    .donut-seg-1 {
      animation: draw-lang-1 1.2s 0.1s ease-out forwards;
      stroke-dashoffset: -153.94;
    }
    

    @keyframes draw-lang-2 {
      from { stroke-dashoffset: -186.92; }
      to { stroke-dashoffset: -153.94; }
    }
    .donut-seg-2 {
      animation: draw-lang-2 1.2s 0.2s ease-out forwards;
      stroke-dashoffset: -186.92;
    }
    

    @keyframes draw-lang-3 {
      from { stroke-dashoffset: -208.92; }
      to { stroke-dashoffset: -186.92; }
    }
    .donut-seg-3 {
      animation: draw-lang-3 1.2s 0.30000000000000004s ease-out forwards;
      stroke-dashoffset: -208.92;
    }
    

    @keyframes draw-lang-4 {
      from { stroke-dashoffset: -219.91; }
      to { stroke-dashoffset: -208.92; }
    }
    .donut-seg-4 {
      animation: draw-lang-4 1.2s 0.4s ease-out forwards;
      stroke-dashoffset: -219.91;
    }
    
  </style>
  
  <rect width="308" height="163" x="1" y="1" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  
  <text x="20" y="24" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" font-size="14" font-weight="600">Top Languages</text>
  
  <!-- Donut Chart -->
  <g>
    <circle cx="65" cy="90" r="35" fill="transparent" stroke="#161b22" stroke-width="9" />
    <circle cx="65" cy="90" r="35" fill="transparent" stroke="#3572A5" stroke-width="9" stroke-dasharray="98.96 120.95" class="donut-seg-0" transform="rotate(-90 65 90)" stroke-linecap="round" />
    <circle cx="65" cy="90" r="35" fill="transparent" stroke="#f34b7d" stroke-width="9" stroke-dasharray="54.98 164.93" class="donut-seg-1" transform="rotate(-90 65 90)" stroke-linecap="round" />
    <circle cx="65" cy="90" r="35" fill="transparent" stroke="#555555" stroke-width="9" stroke-dasharray="32.99 186.92" class="donut-seg-2" transform="rotate(-90 65 90)" stroke-linecap="round" />
    <circle cx="65" cy="90" r="35" fill="transparent" stroke="#DA5B0B" stroke-width="9" stroke-dasharray="21.99 197.92" class="donut-seg-3" transform="rotate(-90 65 90)" stroke-linecap="round" />
    <circle cx="65" cy="90" r="35" fill="transparent" stroke="#198CE7" stroke-width="9" stroke-dasharray="11.00 208.92" class="donut-seg-4" transform="rotate(-90 65 90)" stroke-linecap="round" />
    <!-- Center text/percentage -->
    <circle cx="65" cy="90" r="28" fill="#0d1117" />
    <text x="65" y="93" class="center-text">45%</text>
  </g>
  
  <!-- Legend list -->
  <g>
    <g transform="translate(145, 46)">
      <circle cx="5" cy="5" r="4.5" fill="#3572A5" />
      <text x="18" y="9" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" font-size="11" font-weight="600">Python</text>
      <text x="135" y="9" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" font-size="11" font-weight="600">45%</text>
    </g>
    <g transform="translate(145, 66)">
      <circle cx="5" cy="5" r="4.5" fill="#f34b7d" />
      <text x="18" y="9" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" font-size="11" font-weight="600">C++</text>
      <text x="135" y="9" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" font-size="11" font-weight="600">25%</text>
    </g>
    <g transform="translate(145, 86)">
      <circle cx="5" cy="5" r="4.5" fill="#555555" />
      <text x="18" y="9" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" font-size="11" font-weight="600">C</text>
      <text x="135" y="9" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" font-size="11" font-weight="600">15%</text>
    </g>
    <g transform="translate(145, 106)">
      <circle cx="5" cy="5" r="4.5" fill="#DA5B0B" />
      <text x="18" y="9" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" font-size="11" font-weight="600">Jupyter Notebook</text>
      <text x="135" y="9" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" font-size="11" font-weight="600">10%</text>
    </g>
    <g transform="translate(145, 126)">
      <circle cx="5" cy="5" r="4.5" fill="#198CE7" />
      <text x="18" y="9" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" font-size="11" font-weight="600">R</text>
      <text x="135" y="9" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica" font-size="11" font-weight="600">5%</text>
    </g>
  </g>
</svg>